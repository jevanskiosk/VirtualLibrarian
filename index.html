<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Virtual Librarian - Halloween</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&display=swap');

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  font-family: 'Baloo 2', cursive, sans-serif;
  background: url('halloweenbackground.png') no-repeat center center fixed;
  background-size: cover;
  overflow: hidden;
}

/* =========================================
   WARNING CRAWL
   ========================================= */

.crawl {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  color: #ff7518;
  padding: 10px 0;
  font-size: 36px;
  overflow: hidden;
  white-space: nowrap;
  text-shadow:
    2px 2px 8px black,
    0 0 10px purple;
  z-index: 20;
}

.crawl span {
  display: inline-block;
  padding-left: 100%;
  animation: scroll-left 50s linear infinite;
}

@keyframes scroll-left {
  0% {
    transform: translateX(0);
  }

  100% {
    transform: translateX(-100%);
  }
}


/* =========================================
   CHATBOT
   Positioned INSIDE the existing speech bubble
   in the Halloween background
   ========================================= */

.chatbot {
  position: fixed;

  /* Position inside the large white speech bubble */
  left: 37.5vw;
  top: 10vh;

  width: 32vw;
  height: 78vh;

  border: 4px solid orange;
  box-shadow:
    0 0 20px rgba(255,140,0,0.7),
    0 0 30px purple;

  border-radius: 12px;
  background: rgba(0,0,0,0.15);

  z-index: 10;
}


/* =========================================
   YOUTUBE / QR SECTION
   Positioned on the LEFT side
   ========================================= */

.sidebar {
  position: fixed;

  /* This is the area where the chatbot
     was previously located */
  left: 10vw;
  top: 42vh;

  width: 300px;

  display: flex;
  flex-direction: column;
  align-items: center;

  color: #fff;

  text-shadow:
    2px 2px 6px rgba(0,0,0,.9);

  z-index: 10;
}


/* =========================================
   QR SECTION
   ========================================= */

.qr-section {
  text-align: center;
  margin: 0;
}

.qr-section h3 {
  font-size: 32px;
  margin: 0 0 12px 0;

  color: #ffcc00;

  text-shadow:
    0 0 8px orange,
    0 0 12px purple;

  padding: 8px 12px;

  border-radius: 8px;

  background-color: rgba(0,0,0,0.5);

  display: inline-block;
}

.qr-section img {
  width: 173px;
  height: 173px;

  display: block;
  margin: 0 auto;

  border: 3px solid #ff7518;

  box-shadow:
    0 0 12px orange,
    0 0 20px purple;

  border-radius: 12px;
}


/* =========================================
   RESPONSIVE
   ========================================= */

@media(max-width: 1000px) {

  .crawl {
    font-size: 28px;
  }

  .chatbot {
    left: 35vw;
    top: 12vh;
    width: 36vw;
    height: 75vh;
  }

  .sidebar {
    left: 5vw;
    top: 40vh;
    width: 280px;
  }

  .qr-section h3 {
    font-size: 28px;
  }

  .qr-section img {
    width: 150px;
    height: 150px;
  }
}


/* =========================================
   SMALL SCREEN
   ========================================= */

@media(max-width: 800px) {

  html, body {
    overflow-y: auto;
  }

  .crawl {
    font-size: 24px;
  }

  .chatbot {
    position: absolute;
    left: 5vw;
    top: 15vh;
    width: 90vw;
    height: 70vh;
  }

  .sidebar {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 87vh;
    width: 90%;
  }

  .qr-section h3 {
    font-size: 26px;
  }

  .qr-section img {
    width: 140px;
    height: 140px;
  }
}

</style>
</head>


<body>


<!-- =========================================
     WARNING CRAWL
     ========================================= -->

<div class="crawl">
  <span>
    🎃 Beware! AI may give incorrect or outdated information — verify important details. • Never share personal or sensitive data. • This chatbot is a support tool, not a replacement for professional advice. 👻
  </span>
</div>


<!-- =========================================
     VIRTUAL LIBRARIAN CHATBOT

     This sits inside the WHITE SPEECH BUBBLE
     that is already part of the background.
     ========================================= -->

<iframe
  class="chatbot"
  src="https://www.playlab.ai/embedded/cma1lng2i17v6rgigh3onpno7"
  allow="clipboard-write">
</iframe>


<!-- =========================================
     YOUTUBE / QR CODE

     This sits on the LEFT side of the page,
     where the chatbot used to be.
     ========================================= -->

<div class="sidebar">

  <div class="qr-section">

    <h3>🎃 Visit Our YouTube 🎃</h3>

    <img
      src="https://api.qrserver.com/v1/create-qr-code/?size=216x216&data=https://www.youtube.com/c/mrevans"
      alt="QR code for Mr. Evans YouTube channel">

  </div>

</div>


</body>
</html>
