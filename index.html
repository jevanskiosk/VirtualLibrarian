
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas - Library Playlist</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: black;
  height: 100%;
  width: 100%;
  overflow: hidden;
}

/* Fullscreen YouTube playlist */
.video-container {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: black;
}

.video-container iframe {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 120vw;
  height: 120vh;
  transform: translate(-50%, -50%);
  border: none;
}

/* Christmas holiday crawl */
.holiday-crawl {
  position: fixed;
  bottom: 3%;
  left: 0;
  width: 100%;
  overflow: hidden;
  white-space: nowrap;
  z-index: 10;
  pointer-events: none;
}

.holiday-crawl span {
  display: inline-block;
  padding-left: 100%;
  font-family: Arial, sans-serif;
  font-size: 34px;
  font-weight: bold;
  color: #ffffff;
  text-shadow:
    2px 2px 4px #000000,
    0 0 8px #b71c1c,
    0 0 12px #165b33;
  animation: holiday-scroll 25s linear infinite;
}

@keyframes holiday-scroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}

/* Falling snow */
.snow {
  position: fixed;
  top: -10px;
  color: white;
  font-size: 18px;
  opacity: 0.7;
  pointer-events: none;
  z-index: 5;
  animation: snowfall linear infinite;
}

.snow:nth-of-type(1) {
  left: 10%;
  animation-duration: 12s;
}

.snow:nth-of-type(2) {
  left: 25%;
  animation-duration: 16s;
  animation-delay: 3s;
}

.snow:nth-of-type(3) {
  left: 45%;
  animation-duration: 14s;
  animation-delay: 1s;
}

.snow:nth-of-type(4) {
  left: 65%;
  animation-duration: 18s;
  animation-delay: 5s;
}

.snow:nth-of-type(5) {
  left: 85%;
  animation-duration: 13s;
  animation-delay: 2s;
}

@keyframes snowfall {
  0% {
    transform: translateY(-10vh) rotate(0deg);
  }
  100% {
    transform: translateY(110vh) rotate(360deg);
  }
}

/* Festive Christmas lights across the top */
.christmas-lights {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 35px;
  z-index: 8;
  pointer-events: none;
  display: flex;
  justify-content: space-around;
  align-items: flex-start;
  border-top: 3px solid #165b33;
}

.bulb {
  width: 13px;
  height: 19px;
  border-radius: 50%;
  margin-top: 4px;
  animation: twinkle 1.8s ease-in-out infinite alternate;
}

.bulb:nth-child(4n+1) {
  background: #ff3333;
  box-shadow: 0 0 12px #ff3333;
}

.bulb:nth-child(4n+2) {
  background: #ffe066;
  box-shadow: 0 0 12px #ffe066;
  animation-delay: .5s;
}

.bulb:nth-child(4n+3) {
  background: #33cc66;
  box-shadow: 0 0 12px #33cc66;
  animation-delay: 1s;
}

.bulb:nth-child(4n+4) {
  background: #3399ff;
  box-shadow: 0 0 12px #3399ff;
  animation-delay: 1.5s;
}

@keyframes twinkle {
  from { opacity: .45; }
  to { opacity: 1; }
}

/* Bottom evergreen holiday trim */
.holiday-trim {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 8px;
  background: linear-gradient(
    90deg,
    #165b33,
    #237a42,
    #b71c1c,
    #165b33,
    #b71c1c,
    #237a42,
    #165b33
  );
  z-index: 9;
  pointer-events: none;
}
</style>
</head>

<body>

<div class="video-container">
  <iframe
    src="https://www.youtube.com/embed/videoseries?si=EmUcm--X-SNPLCWW&amp;list=PLoNXhSmdR5P1gpXpkMvFpx-JDFRa5U7dx&autoplay=1"
    title="Christmas Holiday Playlist"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen>
  </iframe>
</div>

<!-- Falling snowflakes -->
<div class="snow">❄</div>
<div class="snow">❄</div>
<div class="snow">❄</div>
<div class="snow">❄</div>
<div class="snow">❄</div>

<!-- Christmas lights -->
<div class="christmas-lights">
  <div class="bulb"></div>
  <div class="bulb"></div>
  <div class="bulb"></div>
  <div class="bulb"></div>
  <div class="bulb"></div>
  <div class="bulb"></div>
  <div class="bulb"></div>
  <div class="bulb"></div>
  <div class="bulb"></div>
  <div class="bulb"></div>
  <div class="bulb"></div>
  <div class="bulb"></div>
  <div class="bulb"></div>
  <div class="bulb"></div>
  <div class="bulb"></div>
</div>

<!-- Holiday crawl -->
<div class="holiday-crawl">
  <span>🎄❄️ Happy holiday, Monsoons! Break starts December 19th! 🎅🏼🎁✨</span>
</div>

<!-- Bottom holiday trim -->
<div class="holiday-trim"></div>

</body>
</html>
