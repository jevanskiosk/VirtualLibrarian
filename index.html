
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Virtual Librarian - Holiday Edition</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&display=swap');

html,body{
  margin:0;
  padding:0;
  height:100%;
  width:100%;
  font-family:'Baloo 2',cursive,sans-serif;
  background:url('backgroundwithbubble.png') no-repeat center center fixed;
  background-size:cover;
  overflow-x:hidden;
  overflow-y:hidden;
}

/* Holiday scrolling message */
.crawl{
  width:100%;
  color:#fff4ce;
  padding:10px 0;
  font-size:36px;
  overflow:hidden;
  white-space:nowrap;
  text-shadow:2px 2px 5px rgba(0,0,0,.9);
  z-index:10;
}

.crawl span{
  display:inline-block;
  padding-left:100%;
  animation:scroll-left 50s linear infinite;
}

@keyframes scroll-left{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}

/* Main layout */
.container{
  display:flex;
  flex-direction:row;
  align-items:flex-start;
  padding:0 40px;
  gap:60px;
  margin-top:10px;
}

/* Chatbot */
.chatbot{
  width:26vw;
  height:85vh;
  border:3px solid #b51f32;
  box-shadow:0 0 16px rgba(255,215,120,.65);
  border-radius:12px;
  background:transparent;
  margin-left:200px;
  z-index:5;
}

/* Holiday sidebar */
.sidebar{
  display:flex;
  flex-direction:column;
  align-items:center;
  max-width:380px;
  color:#fff;
  text-shadow:1px 1px 4px rgba(0,0,0,.7);
  margin-left:225px;
  margin-top:305px;
  z-index:5;
}

/* YouTube QR section */
.qr-section{
  text-align:center;
  margin-bottom:20px;
  margin-top:30px;
  text-shadow:2px 2px 6px rgba(0,0,0,0.9);
}

.qr-section h3{
  font-size:36px;
  margin-bottom:10px;
  background-color:rgba(139,25,40,0.85);
  color:#fff3d0;
  border:2px solid #e5c16a;
  padding:8px 12px;
  border-radius:8px;
  display:inline-block;
  box-shadow:0 0 12px rgba(255,215,120,.4);
}

.qr-section img{
  width:173px;
  height:173px;
  display:block;
  margin:0 auto;
  border:5px solid #fff4ce;
  border-radius:8px;
  box-shadow:0 0 12px rgba(0,0,0,.6);
}

/* Mobile layout */
@media(max-width:800px){
  .container{
    flex-direction:column;
    align-items:center;
    gap:30px;
    padding:20px;
    margin-left:0;
  }

  .chatbot{
    width:90vw;
    height:75vh;
    margin-left:0;
  }

  .sidebar{
    align-items:center;
    max-width:90%;
    margin-left:0;
    margin-top:0;
  }

  .qr-section h3{font-size:32px;}
  .qr-section img{width:140px;height:140px;}
}

/* Festive decorative accents */
</style>
</head>

<body>

<div class="crawl">
  <span>🎄 ❄️ Happy Holidays, Monsoons! 🎅 Break starts December 19th! ☃️ Wishing you a wonderful winter break filled with books, joy, and a little holiday magic! 🎁 ✨ ❄️</span>
</div>

<div class="container">

  <iframe
    class="chatbot"
    src="https://www.playlab.ai/embedded/cma1lng2i17v6rgigh3onpno7"
    allow="clipboard-write">
  </iframe>

  <div class="sidebar">

    <div class="qr-section">
      <h3>🎄 Check us out on YouTube! 🎄</h3>

      <img
        src="https://api.qrserver.com/v1/create-qr-code/?size=216x216&data=https://www.youtube.com/c/mrevans"
        alt="QR code for Mr. Evans YouTube channel">

    </div>

  </div>

</div>

</body>
</html>
