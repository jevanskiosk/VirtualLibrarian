<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Virtual Librarian - Halloween</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&display=swap');

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  font-family: 'Baloo 2', cursive, sans-serif;
  background: url('halloweenbackground.png') no-repeat center center fixed;
  background-size: cover;
  overflow: hidden;
}


/* =========================================
   WARNING CRAWL
   ========================================= */

.crawl {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  color: #ff7518;
  padding: 10px 0;
  font-size: 36px;
  overflow: hidden;
  white-space: nowrap;
  text-shadow:
    2px 2px 8px black,
    0 0 10px purple;
  z-index: 30;
}

.crawl span {
  display: inline-block;
  padding-left: 100%;
  animation: scroll-left 50s linear infinite;
}

@keyframes scroll-left {
  0% {
    transform: translateX(0);
  }

  100% {
    transform: translateX(-100%);
  }
}


/* =========================================
   VIRTUAL LIBRARIAN CHATBOT
   =========================================

   The Halloween background already contains
   the large white speech bubble.

   The chatbot is placed INSIDE that bubble
   with NO border or shadow so it blends in.
   ========================================= */

.chatbot {
  position: fixed;

  /* White speech bubble location */
  left: 37.8vw;
  top: 0;

  /* Fit INSIDE the speech bubble */
  width: 26.2vw;
  height: 100vh;

  border: none;
  outline: none;

  box-shadow: none;

  background: transparent;

  /* Match the rounded speech bubble */
  border-radius: 60px;

  overflow: hidden;

  z-index: 10;
}


/* =========================================
   YOUTUBE / QR SECTION
   ========================================= */

.sidebar {
  position: fixed;

  /* Left side of the background */
  left: 9.5vw;
  top: 42vh;

  width: 300px;

  display: flex;
  flex-direction: column;
  align-items: center;

  color: #fff;

  text-shadow:
    2px 2px 6px rgba(0,0,0,.9);

  z-index: 15;
}


/* =========================================
   YOUTUBE TITLE
   ========================================= */

.qr-section {
  text-align: center;
  margin: 0;
}

.qr-section h3 {
  font-size: 32px;

  margin: 0 0 12px 0;

  color: #ffcc00;

  text-shadow:
    0 0 8px orange,
    0 0 12px purple;

  padding: 8px 12px;

  border-radius: 8px;

  background-color: rgba(0,0,0,0.55);

  display: inline-block;
}


/* =========================================
   QR CODE
   ========================================= */

.qr-section img {
  width: 173px;
  height: 173px;

  display: block;

  margin: 0 auto;

  border: 3px solid #ff7518;

  box-shadow:
    0 0 12px orange,
    0 0 20px purple;

  border-radius: 12px;
}


/* =========================================
   LARGE SCREEN ADJUSTMENT
   ========================================= */

@media (min-width: 1400px) {

  .chatbot {
    left: 37.7vw;
    width: 26.5vw;
    height: 100vh;
  }

  .sidebar {
    left: 9.5vw;
  }
}


/* =========================================
   MEDIUM SCREEN
   ========================================= */

@media (max-width: 1200px) {

  .crawl {
    font-size: 30px;
  }

  .chatbot {
    left: 36vw;
    width: 29vw;
  }

  .sidebar {
    left: 5vw;
    width: 270px;
  }

  .qr-section h3 {
    font-size: 28px;
  }

  .qr-section img {
    width: 150px;
    height: 150px;
  }
}


/* =========================================
   SMALL SCREEN
   ========================================= */

@media (max-width: 800px) {

  html,
  body {
    overflow-y: auto;
  }

  .crawl {
    font-size: 24px;
  }

  .chatbot {
    position: absolute;

    left: 5vw;
    top: 12vh;

    width: 90vw;
    height: 72vh;

    border-radius: 20px;
  }

  .sidebar {
    position: absolute;

    left: 50%;
    transform: translateX(-50%);

    top: 86vh;

    width: 90%;
  }

  .qr-section h3 {
    font-size: 26px;
  }

  .qr-section img {
    width: 140px;
    height: 140px;
  }
}

</style>
</head>


<body>


<!-- =========================================
     WARNING CRAWL
     ========================================= -->

<div class="crawl">
  <span>
    🎃 Beware! AI may give incorrect or outdated information — verify important details. • Never share personal or sensitive data. • This chatbot is a support tool, not a replacement for professional advice. 👻
  </span>
</div>


<!-- =========================================
     VIRTUAL NERD LIBRARIAN
     ========================================= -->

<iframe
  class="chatbot"
  src="https://www.playlab.ai/embedded/cma1lng2i17v6rgigh3onpno7"
  allow="clipboard-write">
</iframe>


<!-- =========================================
     YOUTUBE / QR CODE
     ========================================= -->

<div class="sidebar">

  <div class="qr-section">

    <h3>🎃 Visit Our YouTube 🎃</h3>

    <img
      src="https://api.qrserver.com/v1/create-qr-code/?size=216x216&data=https://www.youtube.com/c/mrevans"
      alt="QR code for Mr. Evans YouTube channel">

  </div>

</div>


</body>
</html>
